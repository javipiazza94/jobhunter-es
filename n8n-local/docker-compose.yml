services:
  n8n:
    image: n8nio/n8n:latest  # Docker Hub: docker.n8n.io daba timeout en esta red
    container_name: n8n-local
    restart: unless-stopped
    # Red del equipo, pero n8n escucha solo en 127.0.0.1: así llega a la API de job-hunter (127.0.0.1:8020,
    # que solo atiende Host localhost) sin exponer nada a la red. Con esto sobran `ports` y `extra_hosts`.
    network_mode: host
    environment:
      - GENERIC_TIMEZONE=Europe/Madrid
      - TZ=Europe/Madrid
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_DIAGNOSTICS_ENABLED=false
      # El nodo Read/Write Files solo puede tocar esta carpeta (el inbox de job-hunter)
      - N8N_RESTRICT_FILE_ACCESS_TO=/inbox
      - N8N_LISTEN_ADDRESS=127.0.0.1
      - N8N_PORT=5678
      # n8n 2.x desactiva por defecto Local File Trigger y Execute Command; solo reactivamos el primero
      - NODES_EXCLUDE=["n8n-nodes-base.executeCommand"]
    volumes:
      - n8n_data:/home/node/.n8n
      # Carpeta donde el script load_inbox_applications.py lee los ficheros
      - ../data/inbox:/inbox

volumes:
  n8n_data:
